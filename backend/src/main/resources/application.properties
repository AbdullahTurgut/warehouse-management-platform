spring.application.name=warehouse
server.port=${PORT:8080}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/warehouse}
spring.datasource.username=${DB_USER:warehouse}
spring.datasource.password=${DB_PASSWORD:warehouse}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
app.seed=${SEED_DEMO:true}
app.admin-password=${ADMIN_PASSWORD:admin123}
app.operator-password=${OPERATOR_PASSWORD:operator123}
